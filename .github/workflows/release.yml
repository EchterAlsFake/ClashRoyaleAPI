name: Publish to PyPI
on:
  workflow_dispatch:
  release:
    types: [published]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: '3.12'
      - run: uv sync --locked
      - run: uv run pytest -q
      - run: uv run ruff check src scripts tests
      - run: uv run mypy
      - run: uv run python scripts/build_docs.py
      - run: uv build
      - run: uv run twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: release-distributions
          path: dist/*
  publish:
    if: vars.PYPI_TRUSTED_PUBLISHING == 'true'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/async-royale-client/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
